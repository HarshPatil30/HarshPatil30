name: README Freshness Check

on:
  pull_request:
    paths:
      - "scripts/**"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "README.md"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify README.md is up to date
        run: cd scripts && python generate_readme.py --check
